name: CarPlayYT
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  CarPlayYT:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CarPlayYT
        PRODUCT_NAME: DriveView
        INFOPLIST_FILE: Sources/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
