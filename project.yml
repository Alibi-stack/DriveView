name: DriveView
options:
  bundleIdPrefix: com.alibistack
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.0
targets:
  DriveView:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Resources/Info.plist
          - Resources/CarPlayScene.fragment.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alibistack.driveview
        PRODUCT_NAME: DriveView
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DriveView.entitlements
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: DriveViewBroadcastExtension

  DriveViewBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alibistack.driveview.broadcast
        PRODUCT_NAME: DriveView Broadcast
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/DriveViewBroadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
